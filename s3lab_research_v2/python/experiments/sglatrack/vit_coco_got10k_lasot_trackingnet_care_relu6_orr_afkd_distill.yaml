# 以 vit_coco_got10k_lasot_trackingnet_care_relu6.yaml 為基準：
#   - 保留 CARE ReLU6 backbone、四資料集、search/template 與 AMP 等設定
# 融合 vit_coco_got10k_distill_mae_teacher_orr_afkd_s60000_bs32.yaml：
#   - ORR（template masking）+ AFKD feature distillation
# Teacher：vit_coco_got10k_lasot_trackingnet_care_relu6 ep300 checkpoint
# 訓練 epoch：300
DATA:
  # 略過未下載的 LaSOT 類別（volleyball / yoyo / zebra）
  LASOT_TRAIN_SPLIT: lasot_train_split_no_vol_yoyo_zebra.txt
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
    - 0.485
    - 0.456
    - 0.406
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 1
  STD:
    - 0.229
    - 0.224
    - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128

  TRAIN:
    DATASETS_NAME:
      - LASOT
      - GOT10K_vottrain
      - COCO17
      - TRACKINGNET
    DATASETS_RATIO:
      - 1
      - 1
      - 1
      - 1
    SAMPLE_PER_EPOCH: 60000

  VAL:
    DATASETS_NAME:
      - GOT10K_votval
    DATASETS_RATIO:
      - 1
    SAMPLE_PER_EPOCH: 10000

MODEL:
  PRETRAIN_FILE: "mae_pretrain_vit_base.pth"
  IS_DISTILL: True
  TEACHER_TYPE: "sglatrack"
  TEACHER_PRETRAIN_FILE: "/home/junjie/01_Research/SGLATrack-main/s3lab_research_v2/python/output/checkpoints/train/sglatrack/vit_coco_got10k_lasot_trackingnet_care_relu6/sglatrack_ep0300.pth.tar"
  ORR_ENABLE: True
  ORR_RANDOM_MASK: False
  ORR_BLOCK_SZ: 16
  ORR_MASK_RATIO: 0.3
  ORR_GAUSSIAN_SIGMA: 64
  EXTRA_MERGER: False
  RETURN_INTER: False
  RETURN_STAGES: []
  BACKBONE:
    TYPE: vit_care_relu6_base_patch16_224
    STRIDE: 16
    MID_PE: False
    SEP_SEG: False
    CAT_MODE: 'direct'
    MERGE_LAYER: 0
    ADD_CLS_TOKEN: False
    CLS_TOKEN_USE_MODE: 'ignore'
    CE_LOC: []
    CE_KEEP_RATIO: []
    CE_TEMPLATE_RANGE: 'ALL'
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256

TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  BATCH_SIZE: 32
  EPOCH: 300
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 5e-5
  LR_BACKBONE: 5e-6
  LR_DROP_EPOCH: 240
  NUM_WORKER: 4
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 999
  WEIGHT_DECAY: 0.0001
  AMP: False
  CE_START_EPOCH: 20
  CE_WARM_EPOCH: 80
  FREEZE_LAYERS: [0, 1, 2]
  DISTILL_LOSS_WEIGHT: 0.00002
  AFKD_TAU0: 10.0
  AFKD_RHO: 10.0
  SIM_LOSS_WEIGHT: 0.0002

TEST:
  EPOCH: 297
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
