# 在 deit_distilled_coco_got10k_orr_afkd.yaml 基礎上加入 AQATrack-main 的 Query 解碼器：
# 可學習 query embedding + Transformer decoder（時序記憶）+ STM 與 search 特徵融合後接原 CENTER head。
# 參考 AQATrack：lib/models/aqatrack/aqatrack.py、experiments/aqatrack/*.yaml
DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 4.5
    FACTOR: 5.0
    SCALE_JITTER: 0.5
    SIZE: 256
    NUMBER: 4
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 1

  TRAIN:
    DATASETS_NAME:
    - COCO17
    - GOT10K_train_full
    DATASETS_RATIO:
    - 1
    - 1
    SAMPLE_PER_EPOCH: 15000
  VAL:
    DATASETS_NAME:
    - GOT10K_votval
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 2500

MODEL:
  PRETRAIN_FILE: "output/checkpoints/train/sglatrack/deit_distilled/sglatrack_ep0297.pth.tar"
  IS_DISTILL: True
  TEACHER_TYPE: cnn
  TEACHER_CNN_NAME: regnety_160
  TEACHER_CNN_PRETRAINED: true
  TEACHER_PRETRAIN_FILE: ""
  ORR_ENABLE: True
  ORR_RANDOM_MASK: False
  ORR_BLOCK_SZ: 16
  ORR_MASK_RATIO: 0.3
  ORR_GAUSSIAN_SIGMA: 64
  EXTRA_MERGER: False
  RETURN_INTER: False
  RETURN_STAGES: []

  AQA_QUERY:
    ENABLE: True

  TRANSFORMER_DEC:
    NHEADS: 8
    DROPOUT: 0.1
    DIM_FEEDFORWARD: 512
    ENC_LAYERS: 0
    DEC_LAYERS: 3
    PRE_NORM: False
    DIVIDE_NORM: False

  BACKBONE:
    TYPE: deit_tiny_distilled_patch16
    STRIDE: 16
    MID_PE: False
    SEP_SEG: False
    CAT_MODE: 'direct'
    MERGE_LAYER: 0
    ADD_CLS_TOKEN: False
    CLS_TOKEN_USE_MODE: 'ignore'
    CE_LOC: []
    CE_KEEP_RATIO: []
    CE_TEMPLATE_RANGE: 'ALL'
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256

TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  # 多 search（NUMBER=4）+ CNN teacher 很吃記憶體；若出現 DataLoader worker Killed，請維持 NUM_WORKER: 0 或再降 BATCH_SIZE。
  BATCH_SIZE: 6
  EPOCH: 50
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 5e-5
  LR_BACKBONE: 5e-6
  LR_DROP_EPOCH: 40
  # 0 = 主程序讀資料，避免多 worker 複製 tensor 導致 RAM 被 OOM killer 殺掉（你遇到的 Killed）
  NUM_WORKER: 0
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 5
  WEIGHT_DECAY: 0.0001
  AMP: False
  CE_START_EPOCH: 20
  CE_WARM_EPOCH: 80
  FREEZE_LAYERS: [0, 1, 2]
  SIM_LOSS_WEIGHT: 0.0002
  DISTILL_LOSS_WEIGHT: 0.00002
  AFKD_TAU0: 10
  AFKD_RHO: 10

TEST:
  EPOCH: 49
  SEARCH_FACTOR: 5.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
