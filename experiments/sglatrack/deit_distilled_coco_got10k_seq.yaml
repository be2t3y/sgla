# SeqTrack 風格離散 bbox decoder；DATA/TEST 對齊 VideoX SeqTrack seqtrack_b256（雙邊 256、factor 4.0 等）。
# MODEL 仍為 SGLA（deit_tiny + SEQ head）。SeqTrack 的 TEMPLATE.NUMBER: 2 在此改為 1：
# lib/train/actors/sglatrack.py 目前 assert 僅支援單模板；若需雙模板須改 actor/backbone。
DATA:
  MAX_SAMPLE_INTERVAL: 400
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3.5
    FACTOR: 4.0
    SCALE_JITTER: 0.5
    SIZE: 256
    NUMBER: 1
  SEQ_FORMAT: xywh
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 4.0
    SCALE_JITTER: 0
    SIZE: 256
    NUMBER: 1

  TRAIN:
    DATASETS_NAME:
    - LASOT
    - GOT10K_vottrain
    - COCO17
    - TRACKINGNET
    DATASETS_RATIO:
    - 1
    - 1
    - 1
    - 1
    SAMPLE_PER_EPOCH: 60000
  VAL:
    DATASETS_NAME:
    - GOT10K_votval
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 10000

MODEL:
  PRETRAIN_FILE: "output/checkpoints/train/sglatrack/deit_distilled/sglatrack_ep0297.pth.tar"
  SEQ_BINS: 1000
  SEQ_DEC_LAYERS: 2
  SEQ_DIM_FF: 512
  SEQ_DROPOUT: 0.1
  SEQ_NHEAD: 4
  EXTRA_MERGER: False
  RETURN_INTER: False
  RETURN_STAGES: []
  BACKBONE:
    TYPE: deit_tiny_distilled_patch16
    STRIDE: 16
    MID_PE: False
    SEP_SEG: False
    CAT_MODE: 'direct'
    MERGE_LAYER: 0
    ADD_CLS_TOKEN: False
    CLS_TOKEN_USE_MODE: 'ignore'
    CE_LOC: []
    CE_KEEP_RATIO: []
    CE_TEMPLATE_RANGE: 'ALL'
  HEAD:
    TYPE: SEQ
    NUM_CHANNELS: 256

TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  CE_WEIGHT: 1.0
  DROP_PATH_RATE: 0.1
  BATCH_SIZE: 32
  EPOCH: 50
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 5e-5
  LR_BACKBONE: 5e-6
  LR_DROP_EPOCH: 40
  NUM_WORKER: 8
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 5
  WEIGHT_DECAY: 0.0001
  AMP: False
  CE_START_EPOCH: 20
  CE_WARM_EPOCH: 80
  FREEZE_LAYERS: [0, 1, 2]

# 與 seqtrack_b256 的 TEST 裁切一致（SGLA tracker 僅讀這四項；VOT UPDATE_* / WINDOW 未接線可略）
TEST:
  EPOCH: 49
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 4.0
  TEMPLATE_SIZE: 256
