# COCO17 + GOT10K + ORTrack 式 ORR + AFKD 蒸餾；骨幹為 ViT-Base（lib/models/sglatrack/vit.py）。
# PRETRAIN_FILE / TEACHER_PRETRAIN_FILE：MAE ViT-Base 權重；若為純 backbone 檔（無 net 鍵），build_sglatrack 會略過整模組載入。
# 顯存：ViT-Base 比 DeiT-Tiny 大很多；約 12GB 卡請維持較小 BATCH_SIZE 並建議 AMP True。仍 OOM 可再降到 4。
DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 4.5
    FACTOR: 5.0
    SCALE_JITTER: 0.5
    SIZE: 256
    NUMBER: 1
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 1

  TRAIN:
    DATASETS_NAME:
    - COCO17
    - GOT10K_train_full
    DATASETS_RATIO:
    - 1
    - 1
    SAMPLE_PER_EPOCH: 60000
  VAL:
    DATASETS_NAME:
    - GOT10K_votval
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 10000

MODEL:
  PRETRAIN_FILE: "/home/junjie/01_Research/SGLATrack-main/output/checkpoints/train/sglatrack/deit_distilled/mae_pretrain_vit_base.pth"
  IS_DISTILL: True
  TEACHER_PRETRAIN_FILE: "/home/junjie/01_Research/SGLATrack-main/output/checkpoints/train/sglatrack/deit_distilled/mae_pretrain_vit_base.pth"
  ORR_ENABLE: True
  ORR_RANDOM_MASK: False
  ORR_BLOCK_SZ: 16
  ORR_MASK_RATIO: 0.3
  ORR_GAUSSIAN_SIGMA: 64
  EXTRA_MERGER: False
  RETURN_INTER: False
  RETURN_STAGES: []
  BACKBONE:
    TYPE: vit_base_patch16_224
    STRIDE: 16
    MID_PE: False
    SEP_SEG: False
    CAT_MODE: 'direct'
    MERGE_LAYER: 0
    ADD_CLS_TOKEN: False
    CLS_TOKEN_USE_MODE: 'ignore'
    CE_LOC: []
    CE_KEEP_RATIO: []
    CE_TEMPLATE_RANGE: 'ALL'
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256

TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  BATCH_SIZE: 8
  EPOCH: 50
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 5e-5
  LR_BACKBONE: 5e-6
  LR_DROP_EPOCH: 40
  NUM_WORKER: 8
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 5
  WEIGHT_DECAY: 0.0001
  AMP: True
  CE_START_EPOCH: 20
  CE_WARM_EPOCH: 80
  FREEZE_LAYERS: [0, 1, 2]
  SIM_LOSS_WEIGHT: 0.0002
  DISTILL_LOSS_WEIGHT: 0.00002
  AFKD_TAU0: 10
  AFKD_RHO: 10

TEST:
  EPOCH: 49
  SEARCH_FACTOR: 5.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
